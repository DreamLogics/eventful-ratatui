# Publishes a release when a version tag is pushed:
#
#     git tag v0.1.1 && git push origin v0.1.1
#
# The tag must match the version in Cargo.toml, and CHANGELOG.md must have a
# section for it; that section becomes the GitHub release notes.
#
# Publishing uses crates.io Trusted Publishing: no token is stored here. Each
# crate's settings on crates.io trust this repository, the workflow file
# release.yml and the environment crates-io.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time; never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    needs: check
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      # Trusted Publishing: the job's identity is exchanged for a crates.io
      # token that expires after 30 minutes.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      - name: Check the tag, version and changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "eventful-ratatui") | .version')
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the crate version $crate"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Macros first: eventful-ratatui depends on them. A crate version that
      # is already on crates.io is skipped, so a failed run can be re-run.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in eventful-ratatui-macros eventful-ratatui; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "eventful-ratatui release workflow (github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already on crates.io; skipping"
            else
              cargo publish -p "$crate" --locked
            fi
          done

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The changelog section for this version, without its heading.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "eventful-ratatui $version" \
            --notes-file notes.md \
            --verify-tag $prerelease
