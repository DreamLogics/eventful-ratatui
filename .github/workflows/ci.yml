# Checks every push to main and every pull request; the release workflow
# runs the same checks before publishing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, rustdoc included.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, not "stable": the macro UI tests compare compiler messages
      # with snapshots, which change between Rust versions. This is also the
      # minimum supported version (rust-version in Cargo.toml).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Docs
        run: cargo doc --workspace --no-deps --locked

      # Packages both crates and builds them the way crates.io will.
      - name: Publish dry run
        run: cargo publish --workspace --dry-run --locked
