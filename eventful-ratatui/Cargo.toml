[package]
name = "eventful-ratatui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Ratatui applications on eventful-rs: components, focus, key bindings and a redraw loop"
keywords = ["tui", "ratatui", "events", "async", "terminal"]
categories = ["command-line-interface", "asynchronous"]
publish = false # Until the 0.1 release.

[dependencies]
eventful-rs.workspace = true
eventful-ratatui-macros.workspace = true
ratatui.workspace = true
ratatui-core.workspace = true
crossterm.workspace = true
futures.workspace = true
futures-timer.workspace = true
unicode-segmentation = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }
crol.workspace = true
serde.workspace = true

[target.'cfg(unix)'.dependencies]
# Asking the terminal for its colors.
rustix.workspace = true

# Where `crate:eventful-ratatui` schema references in theme files point.
[package.metadata.crol]
schema = "themes/theme.schema.crol"

[features]
default = ["components"]
## Ready-made components: buttons, inputs, lists, tabs, dialogs and more.
components = ["dep:unicode-segmentation", "dep:unicode-width"]

[dev-dependencies]
# The schema of theme files is derived in a test.
crol = { workspace = true, features = ["derive"] }
trybuild = "1"
