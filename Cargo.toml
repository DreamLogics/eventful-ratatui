[workspace]
members = [
    "eventful-ratatui",
    "eventful-ratatui-macros",
    "examples/dashboard",
    "examples/chat",
    "examples/gallery",
]
resolver = "3"

[workspace.package]
authors = ["Sanne Ladage", "eventful-ratatui contributors"]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/DreamLogics/eventful-ratatui"
repository = "https://github.com/DreamLogics/eventful-ratatui"

[workspace.dependencies]
# 0.2.2 is the first release with the panic reporter and the documented
# `{Trait}Emissions` contract.
eventful-rs = "0.2.2"
eventful-ratatui = { path = "eventful-ratatui" }
eventful-ratatui-macros = { path = "eventful-ratatui-macros", version = "=0.1.0" }
ratatui = "0.30"
ratatui-core = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
futures-timer = "3"
tokio = "1.53"
unicode-segmentation = "1.12"
unicode-width = "0.2"
crol = "0.3"
rustix = { version = "1.1", features = ["termios"] }
serde = { version = "1", features = ["derive"] }
