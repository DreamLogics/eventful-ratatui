[workspace]
members = [
    "eventful-ratatui",
    "eventful-ratatui-macros",
    "examples/dashboard",
    "examples/chat",
]
resolver = "3"

[workspace.package]
authors = ["Sanne Ladage", "eventful-ratatui contributors"]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/DreamLogics/eventful-ratatui"
repository = "https://github.com/DreamLogics/eventful-ratatui"

[workspace.dependencies]
# Path dependency while both crates are 0.x; switch to a crates.io version
# once eventful-rs ships the core fixes this crate needs.
eventful-rs = { version = "0.2.2", path = "../eventful-rs/eventful-rs" }
eventful-ratatui = { path = "eventful-ratatui" }
ratatui = "0.30"
ratatui-core = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
futures-timer = "3"
tokio = "1.53"
